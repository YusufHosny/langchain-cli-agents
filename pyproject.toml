[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-cli-agents"
version = "0.1.0"
description = "Drive claude -p and opencode as LangChain chat models and MCP tool-calling agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=0.3",
  "pydantic>=2",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2", "uvicorn"]

[dependency-groups]
dev = ["pytest>=8", "langchain-cli-agents[mcp]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
